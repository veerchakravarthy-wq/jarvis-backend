<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JARVIS AI</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial;
}

/* HUD */
#hud {
    position: absolute;
    top: 20px;
    left: 20px;
    color: cyan;
    text-shadow: 0 0 10px cyan;
}

/* Status */
#statusText {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: cyan;
    text-shadow: 0 0 10px cyan;
}

/* Overlay */
#overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background: radial-gradient(circle, transparent 60%, rgba(0,255,255,0.1));
}

/* Button */
#cmdBtn {
    position: absolute;
    bottom: 20px;
    left: 20px;
    padding: 10px 15px;
    background: black;
    color: cyan;
    border: 1px solid cyan;
}
</style>
</head>

<body>

<div id="hud">
    <div id="time"></div>
    <div>JARVIS SYSTEM ACTIVE</div>
</div>

<div id="statusText">Ready for command</div>
<div id="overlay"></div>
<button id="cmdBtn" onclick="manualCommand()">Command</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ---------------- SCENE ----------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.z = 5;

// Renderer FIXED
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio); // FIX
document.body.appendChild(renderer.domElement);

// ---------------- HOLOGRAM ----------------
const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(1, 32, 32),
    new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        wireframe: true,
        transparent: true,
        opacity: 0.7
    })
);
scene.add(sphere);

// Ring
const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.5, 0.02, 16, 100),
    new THREE.MeshBasicMaterial({ color: 0x00ffff })
);
scene.add(ring);

// ---------------- PARTICLES ----------------
const particlesGeometry = new THREE.BufferGeometry();
const count = 800;
const posArray = new Float32Array(count * 3);

for (let i = 0; i < count * 3; i++) {
    posArray[i] = (Math.random() - 0.5) * 8;
}

particlesGeometry.setAttribute(
    'position',
    new THREE.BufferAttribute(posArray, 3)
);

const particlesMaterial = new THREE.PointsMaterial({
    size: 0.03,
    color: 0x00ffff
});

const particles = new THREE.Points(particlesGeometry, particlesMaterial);
scene.add(particles);

// ---------------- ANIMATION ----------------
let speed = 0.01;
let running = true;

function animate() {
    requestAnimationFrame(animate);

    if (running) {
        sphere.rotation.y += speed;
        ring.rotation.x += speed;
        ring.rotation.y += speed;
        particles.rotation.y += speed / 2;

        // breathing effect
        const scale = 1 + Math.sin(Date.now() * 0.002) * 0.05;
        sphere.scale.set(scale, scale, scale);
    }

    renderer.render(scene, camera);
}
animate();

// ---------------- TIME ----------------
setInterval(() => {
    document.getElementById("time").innerText =
        new Date().toLocaleTimeString();
}, 1000);

// ---------------- COMMAND ----------------
function manualCommand() {
    let cmd = prompt("Enter Command:");
    if (cmd) {
        processCommand(cmd.toLowerCase());
    }
}

function processCommand(command) {
    document.getElementById("statusText").innerText = "Analyzing command...";

    if (command.includes("stop")) running = false;
    else if (command.includes("start")) running = true;
    else if (command.includes("fast")) speed = 0.05;
    else if (command.includes("slow")) speed = 0.005;

    sendCommandToJarvis(command);
}

// ---------------- AI CONNECTION ----------------
async function sendCommandToJarvis(command) {
    try {
        const res = await fetch("https://jarvis-backend-1-m4i2.onrender.com/command", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ command })
        });

        const data = await res.json();
        updateResponse(data.reply);

    } catch (err) {
        console.error(err);

        // fallback
        let reply = "Connection error. Switching to offline mode.";

        if (command.includes("hello")) reply = "Hello Commander";
        else if (command.includes("time")) reply = new Date().toLocaleTimeString();
        else if (command.includes("date")) reply = new Date().toDateString();

        updateResponse(reply);
    }
}

// ---------------- RESPONSE ----------------
function updateResponse(text) {
    document.getElementById("statusText").innerText = text;
    speak(text);
}

// ---------------- VOICE ----------------
function speak(text) {
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    window.speechSynthesis.speak(speech);
}

// ---------------- RESIZE ----------------
window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
});
</script>

</body>
</html>
