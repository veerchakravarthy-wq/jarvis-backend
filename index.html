<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JARVIS AI</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial;
}

#hud {
    position: absolute;
    top: 20px;
    left: 20px;
    color: cyan;
    text-shadow: 0 0 10px cyan;
}

#statusText {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: cyan;
    text-shadow: 0 0 10px cyan;
    text-align: center;
    width: 90%;
}
    
canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
}
    
    #topBar {
    position: absolute;
    top: 0;
    width: 100%;
    text-align: center;
    color: cyan;
    padding: 5px;
    border-bottom: 1px solid cyan;
    text-shadow: 0 0 10px cyan;
}

#overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background: radial-gradient(circle, transparent 60%, rgba(0,255,255,0.1));
} 
/* ---------- Buttons ----------- */
    #leftPanel button, #rightPanel button {
    width: 100%;
    margin: 6px 0;
    padding: 6px;

    background: black;
    color: cyan;

    border: 1px solid cyan;
    border-radius: 5px;

    cursor: pointer;

    transition: all 0.3s ease;
}

/* 🔥 Hover Effect */
#leftPanel button:hover, #rightPanel button:hover {
    background: cyan;
    color: black;

    box-shadow: 0 0 15px cyan;
    transform: scale(1.05);
}
    
#button {
    position: absolute;
    bottom: 20px;
    padding: 6px;
    background: black;
    color: cyan;
    border: 1px solid cyan;
}   
    /* ===== HUD PANELS ===== */
#leftPanel, #rightPanel {
    position: absolute;
    top: 60px;
    width: 160px;
    padding: 15px;
    z-index: 10;
    color: cyan;
    text-shadow: 0 0 10px cyan;

    border: 1px solid cyan;
    border-radius: 10px;

    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(5px);

    box-shadow: 0 0 10px cyan, inset 0 0 10px cyan;

    animation: panelGlow 2s infinite alternate;
}

/* Position */
#leftPanel { left: 10px; }
#rightPanel { right: 10px; }

/* ===== PANEL GLOW ANIMATION ===== */
@keyframes panelGlow {
    0% {
        box-shadow: 0 0 5px cyan, inset 0 0 5px cyan;
    }
    100% {
        box-shadow: 0 0 20px cyan, inset 0 0 15px cyan;
    }
}

    /* --------------- SCAN EFFECT -------------- */
    #leftPanel::before, #rightPanel::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: linear-gradient(
        transparent,
        rgba(0,255,255,0.2),
        transparent
    );

    animation: scan 3s linear infinite;
}

@keyframes scan {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100%); }
}
    
/* ---------------- UI STATES ---------------- */

.listening {
    box-shadow: 0 0 40px cyan, inset 0 0 20px cyan;
}

.thinking {
    animation: pulse 1s infinite;
}

.speaking {
    box-shadow: 0 0 40px lime, inset 0 0 20px lime;
}

@keyframes pulse {
    0% { box-shadow: 0 0 10px purple; }
    50% { box-shadow: 0 0 40px magenta; }
    100% { box-shadow: 0 0 10px purple; }
}
    
#cmdBtn { left: 20px; }
#voiceBtn { right: 20px; }
</style>
</head>

<body>

    <div id="topBar">
<span id="systemStatus">SYSTEM: ONLINE</span>
</div>

<div id="hud">
    <div id="time"></div>
    <div>JARVIS SYSTEM ACTIVE</div>
</div>

<!-- ---------------- HUD DASHBOARD ---------------- -->

<div id="leftPanel">
    <h3>SYSTEM</h3>
    <button onclick="processCommand('system status')">Status</button>
    <button onclick="processCommand('diagnostics')">Diagnostics</button>
    <button onclick="processCommand('battery')">Battery</button>
    <button onclick="processCommand('vibrate')">Vibrate</button>
</div>

<div id="rightPanel">
    <h3>APPS</h3>
    <button onclick="processCommand('open youtube')">YouTube</button>
    <button onclick="processCommand('open google')">Google</button>
    <button onclick="processCommand('open whatsapp')">WhatsApp</button>
</div>
    
<div id="statusText">Ready for command</div>
<div id="overlay"></div>

<button id="cmdBtn" onclick="manualCommand()">Command</button>
<button id="voiceBtn" onclick="startListening()">🎤 Speak</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    
    let userName = localStorage.getItem("jarvis_user") || "";
    let lastCommand = "";
    
// ---------------- SCENE ----------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ---------------- HOLOGRAM ----------------
const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(1,32,32),
    new THREE.MeshBasicMaterial({color:0x00ffff, wireframe:true, opacity:0.7, transparent:true})
);
    sphere.name = "jarvisCore";
scene.add(sphere);

const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.5,0.02,16,100),
    new THREE.MeshBasicMaterial({color:0x00ffff})
);
scene.add(ring);

// ---------------- PARTICLES ----------------
const particlesGeometry = new THREE.BufferGeometry();
const count = 800;
const posArray = new Float32Array(count*3);

for(let i=0;i<count*3;i++){
    posArray[i] = (Math.random()-0.5)*8;
}

particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray,3));

const particles = new THREE.Points(
    particlesGeometry,
    new THREE.PointsMaterial({size:0.03, color:0x00ffff})
);
scene.add(particles);

// ---------------- ANIMATION ----------------
let speed = 0.01;
let running = true;

function animate(){
    requestAnimationFrame(animate);

    if(running){
        sphere.rotation.y += speed;
        ring.rotation.x += speed;
        ring.rotation.y += speed;
        particles.rotation.y += speed/2;

        const scale = 1 + Math.sin(Date.now()*0.002)*0.05;
        sphere.scale.set(scale, scale, scale);
    }

    renderer.render(scene, camera);
}
animate();

// ---------------- TIME ----------------
setInterval(()=>{
    document.getElementById("time").innerText =
        new Date().toLocaleTimeString();
},1000);
    
// ---------------- MANUAL INPUT ----------------
function manualCommand(){
    let cmd = prompt("Enter Command:");
    if(cmd){
        processCommand(cmd.toLowerCase());
    }
}

    // -------------UI STATE-------------
    function setState(state){

    const core = scene.getObjectByName("jarvisCore");

    if(!core) return;

    core.material.color.set(0x00ffff); // default

    if(state === "listening"){
        core.material.color.set(0x00ffff);
    }

    if(state === "thinking"){
        core.material.color.set(0xff00ff);
    }

    if(state === "speaking"){
        core.material.color.set(0x00ff00);
    }
}
    
// ---------------- VOICE INPUT ----------------

let recognition;

function startListening(){

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        updateResponse("Voice not supported");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.lang = "en-US";

    recognition.start();
    setState("listening");

    document.getElementById("statusText").innerText = "Listening for wake word...";

    recognition.onresult = function(event){

        let transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();

        console.log("Heard:", transcript);

        // 🔥 WAKE WORD DETECTION
        if(transcript.includes("hey jarvis")){

            let command = transcript.replace("hey jarvis", "").trim();

            // If user only says "hey jarvis"
            if(command.length === 0){
                updateResponse("Yes Commander, I'm listening.");
                return;
            }

            processCommand(command);
        }
    };

    recognition.onerror = function(){
        recognition.start();
    };

    recognition.onend = function(){
        recognition.start();
    };
}
// --------------- SYSTEM STATUS ---------------
    function updateSystemStatus(text){
    document.getElementById("systemStatus").innerText = text;
}
    
// ---------------- COMMAND PROCESS ----------------
function processCommand(command){

    function flashPanel() {
    const panels = document.querySelectorAll("#leftPanel, #rightPanel");
    panels.forEach(panel => {
        panel.style.boxShadow = "0 0 40px lime";
        setTimeout(() => {
            panel.style.boxShadow = "0 0 10px cyan, inset 0 0 10px cyan";
        }, 300);
    });
}

// ---------------- ADVANCED SYSTEM CONTROL ----------------
function getOfflineResponse(command){

    // ---------------- MEMORY ----------------
if(command.includes("my name is")){
    userName = command.replace("my name is", "").trim();
    localStorage.setItem("jarvis_user", userName);
    return "Nice to meet you " + userName;
}

if(command.includes("what is my name")){
    if(userName){
        return "Your name is " + userName;
    }
    return "I do not know your name yet.";
}
    
    if(command.includes("system status")){
    updateSystemStatus("SYSTEM: ALL SYSTEMS OPERATIONAL");
    return "All systems are operational.";
}
    
if(command.includes("remember this")){
    let note = command.replace("remember this", "").trim();
    localStorage.setItem("jarvis_note", note);
    return "I will remember that.";
}

if(command.includes("what did i say")){
    let note = localStorage.getItem("jarvis_note");
    if(note){
        return "You told me " + note;
    }
    return "No memory found.";
}

    // Greetings
    if(command.includes("hello") || command.includes("hi")){
        return "Hello Commander. Systems online.";
    }

    // System
    if(command.includes("system status")){
        return "All systems are fully operational.";
    }

    if(command.includes("diagnostics")){
        return "Running diagnostics. All modules functioning normally.";
    }

    if(command.includes("performance")){
        speed = 0.05;
        return "Performance mode activated.";
    }

    // Time
    if(command.includes("time")){
        return "Current time is " + new Date().toLocaleTimeString();
    }

    if(command.includes("date")){
        return "Today's date is " + new Date().toDateString();
    }

    // Device
    if(command.includes("battery")){
        if(navigator.getBattery){
            navigator.getBattery().then(battery=>{
                updateResponse("Battery level is " + Math.round(battery.level*100) + "%");
            });
            return "Checking battery...";
        }
        return "Battery info not supported.";
    }

    if(command.includes("vibrate")){
        navigator.vibrate(500);
        return "Vibration activated.";
    }

    if(command.includes("fullscreen")){
        document.documentElement.requestFullscreen();
        return "Fullscreen activated.";
    }

    
// ---------------- APP LAUNCH SYSTEM ----------------
if(command.includes("open youtube")){
    window.open("https://youtube.com");
    return "Opening YouTube.";
}

if(command.includes("open google") || command.includes("open chrome")){
    window.open("https://google.com");
    return "Opening Google.";
}

if(command.includes("open maps") || command.includes("open google maps")){
    window.open("https://maps.google.com");
    return "Opening Google Maps.";
}

if(command.includes("open gmail")){
    window.open("https://mail.google.com");
    return "Opening Gmail.";
}

if(command.includes("open github")){
    window.open("https://github.com");
    return "Opening GitHub.";
}

if(command.includes("open whatsapp")){
    window.open("https://web.whatsapp.com");
    return "Opening WhatsApp Web.";
}

if(command.includes("open instagram")){
    window.open("https://instagram.com");
    return "Opening Instagram.";
}

if(command.includes("open facebook")){
    window.open("https://facebook.com");
    return "Opening Facebook.";
}

if(command.includes("open twitter") || command.includes("open x")){
    window.open("https://x.com");
    return "Opening X.";
}

if(command.includes("open linkedin")){
    window.open("https://linkedin.com");
    return "Opening LinkedIn.";
}

if(command.includes("open amazon")){
    window.open("https://amazon.in");
    return "Opening Amazon.";
}

if(command.includes("open flipkart")){
    window.open("https://flipkart.com");
    return "Opening Flipkart.";
}

if(command.includes("open netflix")){
    window.open("https://netflix.com");
    return "Opening Netflix.";
}

if(command.includes("open spotify")){
    window.open("https://spotify.com");
    return "Opening Spotify.";
}
    
    // ---------------- SMART SEARCH ----------------
if(command.startsWith("search")){

    let query = command.replace("search", "").trim();

    if(query.length > 0){
        let url = "https://www.google.com/search?q=" + encodeURIComponent(query);
        window.open(url);
        return "Searching for " + query;
    }

    return "What should I search, Commander?";
}
    
    // ---------------- SMART PLAY (BETTER) ----------------
if(command.includes("play")){

    let song = command
        .replace("open youtube", "")
        .replace("play", "")
        .replace("song", "")
        .trim();

    if(song.length > 0){

        let url = "https://www.youtube.com/results?search_query=" + encodeURIComponent(song);

        // Open search first
        window.open(url);

        return "Playing " + song + " on YouTube.";
    }

    return "Which song should I play, Commander?";
}
    
    // Control Engine
    if(command.includes("stop")){
        running = false;
        return "System paused.";
    }

    if(command.includes("start")){
        running = true;
        return "System resumed.";
    }

    if(command.includes("fast")){
        speed = 0.05;
        return "Speed increased.";
    }

    if(command.includes("slow")){
        speed = 0.005;
        return "Speed reduced.";
    }

    // Knowledge
    if(command.includes("how many countries")){
        return "There are approximately 195 countries.";
    }

    if(command.includes("prime minister")){
        return "The Prime Minister of India is Narendra Modi.";
    }

    if(command.includes("what is ai")){
        return "Artificial Intelligence is the simulation of human intelligence in machines.";
    }

    // Identity
    if(command.includes("who are you")){
        return "I am JARVIS, your advanced assistant.";
    }

    return generateSmartReply(command);
}

// ---------------- SMART REPLY ----------------
function generateSmartReply(command){
    if(command.includes("what") || command.includes("why")){
        return "That requires deeper intelligence. Expanding capabilities.";
    }

    if(command.includes("how")){
        return "Analyzing. I will improve my responses over time.";
    }

    if(command.includes("help")){
        return "You can ask for system status, open apps, or control device.";
    }

    return "Command acknowledged.";
}

// ---------------- VOICE OUTPUT ----------------
function speak(text){
    const speech = new SpeechSynthesisUtterance(text);
    speech.pitch = 0.8;
    speech.rate = 0.9;
    window.speechSynthesis.speak(speech);
}

// ---------------- RESPONSE ----------------
function updateResponse(text){
    setState("speaking");
    document.getElementById("statusText").innerText = "Listening for wake word...";
    speak(text);
}

// ---------------- RESIZE ----------------
window.addEventListener('resize', ()=>{
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
});
    window.onload = () => {
    setTimeout(() => {
        startListening();
    }, 2000);
};
</script>

</body>
</html>
