<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JARVIS AI</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial;
}

#hud {
    position: absolute;
    top: 20px;
    left: 20px;
    color: cyan;
    text-shadow: 0 0 10px cyan;
}

#statusText {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: cyan;
    text-shadow: 0 0 10px cyan;
    text-align: center;
    width: 90%;
}

#overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background: radial-gradient(circle, transparent 60%, rgba(0,255,255,0.1));
}

button {
    position: absolute;
    bottom: 20px;
    padding: 10px;
    background: black;
    color: cyan;
    border: 1px solid cyan;
}

#cmdBtn { left: 20px; }
#voiceBtn { right: 20px; }
</style>
</head>

<body>

<div id="hud">
    <div id="time"></div>
    <div>JARVIS SYSTEM ACTIVE</div>
</div>

<div id="statusText">Ready for command</div>
<div id="overlay"></div>

<button id="cmdBtn" onclick="manualCommand()">Command</button>
<button id="voiceBtn" onclick="startListening()">🎤 Speak</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ---------------- SCENE ----------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ---------------- HOLOGRAM ----------------
const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(1,32,32),
    new THREE.MeshBasicMaterial({color:0x00ffff, wireframe:true, opacity:0.7, transparent:true})
);
scene.add(sphere);

const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.5,0.02,16,100),
    new THREE.MeshBasicMaterial({color:0x00ffff})
);
scene.add(ring);

// ---------------- PARTICLES ----------------
const particlesGeometry = new THREE.BufferGeometry();
const count = 800;
const posArray = new Float32Array(count*3);

for(let i=0;i<count*3;i++){
    posArray[i] = (Math.random()-0.5)*8;
}

particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray,3));

const particles = new THREE.Points(
    particlesGeometry,
    new THREE.PointsMaterial({size:0.03, color:0x00ffff})
);
scene.add(particles);

// ---------------- ANIMATION ----------------
let speed = 0.01;
let running = true;

function animate(){
    requestAnimationFrame(animate);

    if(running){
        sphere.rotation.y += speed;
        ring.rotation.x += speed;
        ring.rotation.y += speed;
        particles.rotation.y += speed/2;

        const scale = 1 + Math.sin(Date.now()*0.002)*0.05;
        sphere.scale.set(scale, scale, scale);
    }

    renderer.render(scene, camera);
}
animate();

// ---------------- TIME ----------------
setInterval(()=>{
    document.getElementById("time").innerText =
        new Date().toLocaleTimeString();
},1000);

// ---------------- MANUAL INPUT ----------------
function manualCommand(){
    let cmd = prompt("Enter Command:");
    if(cmd){
        processCommand(cmd.toLowerCase());
    }
}

// ---------------- VOICE INPUT ----------------
function startListening(){
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        alert("Voice not supported");
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";

    document.getElementById("statusText").innerText = "Listening...";
    recognition.start();

    recognition.onresult = function(event){
        let command = event.results[0][0].transcript.toLowerCase();
        document.getElementById("statusText").innerText = "You said: " + command;
        processCommand(command);
    };

    recognition.onerror = function(){
        updateResponse("Voice recognition error");
    };
}

// ---------------- COMMAND PROCESS ----------------
function processCommand(command){

    document.getElementById("statusText").innerText = "Analyzing...";

    const reply = getOfflineResponse(command);
    updateResponse(reply);
}

// ---------------- ADVANCED SYSTEM CONTROL ----------------
function getOfflineResponse(command){

    // Greetings
    if(command.includes("hello") || command.includes("hi")){
        return "Hello Commander. Systems online.";
    }

    // System
    if(command.includes("system status")){
        return "All systems are fully operational.";
    }

    if(command.includes("diagnostics")){
        return "Running diagnostics. All modules functioning normally.";
    }

    if(command.includes("performance")){
        speed = 0.05;
        return "Performance mode activated.";
    }

    // Time
    if(command.includes("time")){
        return "Current time is " + new Date().toLocaleTimeString();
    }

    if(command.includes("date")){
        return "Today's date is " + new Date().toDateString();
    }

    // Device
    if(command.includes("battery")){
        if(navigator.getBattery){
            navigator.getBattery().then(battery=>{
                updateResponse("Battery level is " + Math.round(battery.level*100) + "%");
            });
            return "Checking battery...";
        }
        return "Battery info not supported.";
    }

    if(command.includes("vibrate")){
        navigator.vibrate(500);
        return "Vibration activated.";
    }

    if(command.includes("fullscreen")){
        document.documentElement.requestFullscreen();
        return "Fullscreen activated.";
    }

    
// ---------------- APP LAUNCH SYSTEM ----------------
if(command.includes("open youtube")){
    window.open("https://youtube.com");
    return "Opening YouTube.";
}

if(command.includes("open google") || command.includes("open chrome")){
    window.open("https://google.com");
    return "Opening Google.";
}

if(command.includes("open maps") || command.includes("open google maps")){
    window.open("https://maps.google.com");
    return "Opening Google Maps.";
}

if(command.includes("open gmail")){
    window.open("https://mail.google.com");
    return "Opening Gmail.";
}

if(command.includes("open github")){
    window.open("https://github.com");
    return "Opening GitHub.";
}

if(command.includes("open whatsapp")){
    window.open("https://web.whatsapp.com");
    return "Opening WhatsApp Web.";
}

if(command.includes("open instagram")){
    window.open("https://instagram.com");
    return "Opening Instagram.";
}

if(command.includes("open facebook")){
    window.open("https://facebook.com");
    return "Opening Facebook.";
}

if(command.includes("open twitter") || command.includes("open x")){
    window.open("https://x.com");
    return "Opening X.";
}

if(command.includes("open linkedin")){
    window.open("https://linkedin.com");
    return "Opening LinkedIn.";
}

if(command.includes("open amazon")){
    window.open("https://amazon.in");
    return "Opening Amazon.";
}

if(command.includes("open flipkart")){
    window.open("https://flipkart.com");
    return "Opening Flipkart.";
}

if(command.includes("open netflix")){
    window.open("https://netflix.com");
    return "Opening Netflix.";
}

if(command.includes("open spotify")){
    window.open("https://spotify.com");
    return "Opening Spotify.";
}
    
    // ---------------- SMART SEARCH ----------------
if(command.startsWith("search")){

    let query = command.replace("search", "").trim();

    if(query.length > 0){
        let url = "https://www.google.com/search?q=" + encodeURIComponent(query);
        window.open(url);
        return "Searching for " + query;
    }

    return "What should I search, Commander?";
}
    
    // ---------------- PLAY MEDIA ----------------
if(command.includes("play")){

    let song = command.replace("play", "").trim();

    if(song.length > 0){
        let url = "https://www.youtube.com/results?search_query=" + encodeURIComponent(song);
        window.open(url);
        return "Playing " + song + " on YouTube.";
    }

    return "Please specify what to play.";
}
    
    // Control Engine
    if(command.includes("stop")){
        running = false;
        return "System paused.";
    }

    if(command.includes("start")){
        running = true;
        return "System resumed.";
    }

    if(command.includes("fast")){
        speed = 0.05;
        return "Speed increased.";
    }

    if(command.includes("slow")){
        speed = 0.005;
        return "Speed reduced.";
    }

    // Knowledge
    if(command.includes("how many countries")){
        return "There are approximately 195 countries.";
    }

    if(command.includes("prime minister")){
        return "The Prime Minister of India is Narendra Modi.";
    }

    if(command.includes("what is ai")){
        return "Artificial Intelligence is the simulation of human intelligence in machines.";
    }

    // Identity
    if(command.includes("who are you")){
        return "I am JARVIS, your advanced assistant.";
    }

    return generateSmartReply(command);
}

// ---------------- SMART REPLY ----------------
function generateSmartReply(command){
    if(command.includes("what") || command.includes("why")){
        return "That requires deeper intelligence. Expanding capabilities.";
    }

    if(command.includes("how")){
        return "Analyzing. I will improve my responses over time.";
    }

    if(command.includes("help")){
        return "You can ask for system status, open apps, or control device.";
    }

    return "Command acknowledged.";
}

// ---------------- VOICE OUTPUT ----------------
function speak(text){
    const speech = new SpeechSynthesisUtterance(text);
    speech.pitch = 0.8;
    speech.rate = 0.9;
    window.speechSynthesis.speak(speech);
}

// ---------------- RESPONSE ----------------
function updateResponse(text){
    document.getElementById("statusText").innerText = text;
    speak(text);
}

// ---------------- RESIZE ----------------
window.addEventListener('resize', ()=>{
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
});
</script>

</body>
</html>
